name: Test
on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          cache: false
      - name: Show Swift toolchain
        run: |
          xcrun swift --version
          xcodebuild -version
      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .
      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet
    timeout-minutes: 60
  swift-test:
    name: Swift Package Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: |
          xcrun swift --version
          xcodebuild -version
      - name: Run tests
        run: swift test
    timeout-minutes: 60
  ui-test:
    name: UI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: |
          xcrun swift --version
          xcodebuild -version
      - name: Run UI tests
        run: |
          xcodebuild -project Joblet.xcodeproj \
            -scheme Joblet \
            -destination 'platform=macOS' \
            -resultBundlePath build/UITests.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGN_IDENTITY=- \
            test
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results-${{ matrix.os }}
          path: build/UITests.xcresult
    timeout-minutes: 60
